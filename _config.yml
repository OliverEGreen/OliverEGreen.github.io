title: Ollie Green
description: ""
author: Ollie Green
url: "https://olliegreen.info"
baseurl: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/
timezone: Europe/London

# Plugins (all on the GitHub Pages allowlist)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  fun:
    output: true
    permalink: /fun/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: fun
    values:
      layout: project

# Files Jekyll should not copy into _site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - .DS_Store
  - .gitignore
  - scripts
