---
layout: default
---
<article class="post writing-post">
    <header>
        {% if page.unfinished %}<p class="unfinished-tag">Unfinished — still a work in progress</p>{% endif %}
        <p class="meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        </p>
        <h1>{{ page.title }}</h1>
        {% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
    </header>

    {{ content }}
</article>

<nav class="post-nav">
    <a class="escape-hatch" href="{{ '/' | relative_url }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg><span>Who let you in here? Get out!</span></a>
</nav>
