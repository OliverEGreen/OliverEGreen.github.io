---
layout: default
---
<article class="post">
    <header>
        <p class="meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        </p>
        <h1>{{ page.title }}</h1>
        {% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
    </header>

    {{ content }}
</article>

<nav class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; Who let you in here? Get out!</a>
</nav>
