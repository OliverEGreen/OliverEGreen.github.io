---
layout: default
---
<article class="post project-page">
    <header>
        <p class="meta">
            <span class="cv-year">{{ page.year }}</span>
        </p>
        <h1>{{ page.title }}</h1>
        {% if page.kicker %}<p class="tagline">{{ page.kicker }}</p>{% endif %}
    </header>

    {{ content }}
</article>

<nav class="post-nav">
    {% if page.collection == "fun" %}
    <a href="{{ '/fun/' | relative_url }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg><span>Back to the fun</span></a>
    {% else %}
    <a href="{{ '/projects/' | relative_url }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg><span>All projects</span></a>
    {% endif %}
</nav>
