---
layout: default
---
<article class="post project-page">
    <header>
        <p class="meta">
            <span class="cv-year">{{ page.year }}</span>
        </p>
        <h1>{{ page.title }}</h1>
        {% if page.kicker %}<p class="tagline">{{ page.kicker }}</p>{% endif %}
    </header>

    {{ content }}
</article>

<nav class="post-nav">
    <a href="{{ '/projects/' | relative_url }}">&larr; All projects</a>
</nav>
