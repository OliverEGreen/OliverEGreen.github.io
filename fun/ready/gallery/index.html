<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design gallery · Ready</title>
<meta property="og:title" content="Design gallery · Ready">
<link rel="preload" href="/fun/ready/assets/fonts/Ready-Book-102.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fun/ready/assets/fonts/ReadyCondensed-Light-101.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fun/ready/assets/ready.css">
<style>
/* the folder tabs' sheet: a line about the design and three facts */
.fxsheet { padding: 24px; }
.ptext { color: var(--ink2); }
.facts.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="/fun/ready/"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"></path></svg>Ready</a>
  <header>
    <h1>Design gallery</h1>
  </header>
  <main class="view" id="view"></main>
  <p class="credits hint">Photos from Wikimedia Commons, cropped and resized:
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:Braun_SK_4.1.jpg">SK 4</a> by With Associates, <a class="plain" href="https://creativecommons.org/licenses/by-sa/2.0/" rel="license">CC BY-SA 2.0</a>;
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:Braun_T_52_radio.jpg">T 52</a> by Kaldari, <a class="plain" href="https://creativecommons.org/publicdomain/zero/1.0/" rel="license">CC0</a>;
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:1987_Braun_calculator_ET66_by_Dieter_Rams_(13964223413).jpg">ET 66</a> by Pinot Dita, <a class="plain" href="https://creativecommons.org/licenses/by-sa/2.0/" rel="license">CC BY-SA 2.0</a>;
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:DieterRamsTP1Perspective.jpg">TP 1</a> by PeterAjtony, <a class="plain" href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license">CC BY-SA 4.0</a>;
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:606-Universal-Shelving-System.jpg">606</a> by Vitsoe, <a class="plain" href="https://creativecommons.org/licenses/by-sa/3.0/" rel="license">CC BY-SA 3.0</a>;
    <a class="plain" href="https://commons.wikimedia.org/wiki/File:Braun_T1000_-_Design_Museum,_Kensington_-_London_-_DSC01598.jpg">T 1000</a> by Daderot, <a class="plain" href="https://creativecommons.org/publicdomain/zero/1.0/" rel="license">CC0</a>.</p>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/fun/ready/assets/ready.js"></script>
<script>
'use strict';
(function () {
const { $, esc, I, toast, openMenu, tabsHtml, syncTabs, swap, photo, statusHtml, reducedMotion } = Ready;

/* ---------- data ---------- */
const FT = [
  { label: 'Overview', text: 'SK 4, a radio-phonograph Dieter Rams designed with Hans Gugelot for Braun in 1956.', facts: [['Maker', 'Braun'], ['Year', '1956'], ['Photos', '148']] },
  { label: 'Photos', text: '148 photos since 4 March 2024. The newest was added today at 12:47.', facts: [['Newest', 'SK4-148'], ['Approved', '141'], ['Oldest', 'SK4-001']] },
  { label: 'Notes', text: 'Three people have added notes to this design.', facts: [['Anna', 'Today'], ['Tom', 'Yesterday'], ['Mia', 'Sun 18 Oct']] },
  { label: 'Settings', text: 'Every sync is read back and checked. After 90 days, edits thin to one a week.', facts: [['Frequency', 'Daily'], ['Time', '09:00'], ['Keep', '90 days']] },
];
const PROJECTS = [
  { img: 'sk4', title: 'SK 4', sub: 'Radio-phonograph · 1956', state: 'Being photographed', st: 'live' },
  { img: 't52', title: 'T 52', sub: 'Portable radio · 1961', state: 'On display', st: '' },
  { img: 'et66', title: 'ET 66', sub: 'Calculator · 1987', state: 'On display', st: '' },
  { img: 'tp1', title: 'TP 1', sub: 'Portable radio-phonograph · 1959', state: 'In storage', st: 'quiet' },
  { img: '606', title: '606', sub: 'Universal shelving system · 1960', state: 'On display', st: '' },
  { img: 't1000', title: 'T 1000', sub: 'World receiver · 1963', state: 'On loan', st: 'dark' },
];
const S = { tab: 0, idx: 0 };
const UPLOAD = { pct: 64 };

/* ---------- the page ---------- */
const sheetHtml = (f) => `<p class="ptext swap">${esc(f.text)}</p><div class="facts f3">${f.facts.map(([k, v]) => `<div class="swap"><div class="lbl">${esc(k)}</div><div class="fval">${esc(v)}</div></div>`).join('')}</div>`;
$('#view').innerHTML = `
  <section class="tpanel s3" aria-label="SK 4">${tabsHtml('Design', FT.map((f) => f.label), 0, false, 'fx-sheet')}
    <div class="tsheet fxsheet" role="tabpanel" id="fx-sheet" aria-labelledby="design-tab-0">${sheetHtml(FT[0])}</div></section>
  <section class="panel s3" aria-labelledby="car-title"><div class="chead"><h2 class="ptitle" id="car-title">Recent designs</h2></div>
    <div class="cwrap" id="cwrap"><div class="strip" id="strip" role="group" aria-label="Recent designs">${PROJECTS.map((p, i) => `
      <a class="ccard" href="#" data-i="${i}" data-act="toastMsg" data-msg="Opening the ${esc(p.title)}">${photo(p.img, p.title)}
        <div class="cbody"><h3 class="ctitle">${esc(p.title)}</h3><div class="csub">${esc(p.sub)}</div></div><div class="cfoot">${statusHtml(p.st, p.state)}</div></a>`).join('')}</div>
      <button class="cnav prev" type="button" aria-label="Previous" data-act="car" data-d="-1" hidden>${I.bigLeft}</button>
      <button class="cnav next" type="button" aria-label="Next" data-act="car" data-d="1">${I.bigRight}</button></div>
    <div class="dots" id="dots"></div></section>
  <article class="card">${photo('sk4', 'SK 4')}
    <div class="cbody"><h3 class="ctitle">SK 4</h3><div class="csub">Radio-phonograph · 1956</div><p class="ctext">Designed with Hans Gugelot for Braun.</p></div>
    <div class="cfoot">${statusHtml('live', 'Being photographed')}<button class="k grey" type="button" data-act="toastMsg" data-msg="Opening the SK 4">Open</button></div></article>
  <article class="card">${photo('t52', 'T 52')}
    <div class="cbody"><h3 class="ctitle">T 52</h3><div class="csub">Portable radio · 1961</div></div>
    <div class="cfoot col2"><div class="prow"><span class="hint" id="up-text"></span><span id="up-pct"></span></div><div class="pbar" role="progressbar" aria-label="Upload" aria-valuemin="0" aria-valuemax="100" id="up-bar"><i></i></div></div></article>
  <article class="card"><div class="cbody"><div style="margin-bottom: 16px">${statusHtml('dark', 'On loan')}</div><h3 class="ctitle">620</h3><div class="csub">Chair programme · 1962</div>
    <p class="ctext">Designed for Vitsœ. While it’s out on loan, its record and photos stay as they are.</p></div>
    <div class="cfoot" style="justify-content: flex-end"><button class="k grey" type="button" data-act="toastMsg" data-msg="Downloading the 620 record">Download${I.dl}</button><button class="k grey" type="button" data-act="toastMsg" data-msg="Opening the 620 record">Edit record…</button></div></article>
  <section class="panel s2" aria-labelledby="all-title"><h2 class="ptitle" id="all-title" style="margin-bottom: 16px">Recently updated</h2><div class="hlist">
    ${[['et66', 'ET 66', 'Calculator · 1987 · Yesterday, 18:02', '', 'On display'], ['tp1', 'TP 1', 'Portable radio-phonograph · 1959 · Fri 16 Oct', 'quiet', 'In storage'], ['t1000', 'T 1000', 'World receiver · 1963 · Today, 08:30', 'live', 'Being photographed']].map(([img, t, s, st, label]) => `
      <article class="hcard">${photo(img, t, 'hthumb')}<div style="min-width: 0"><h3 class="ctitle ell">${t}</h3><div class="csub ell">${s}</div></div>${statusHtml(st, label)}
        <button class="kb tip-right" type="button" aria-haspopup="menu" aria-label="Actions for ${t}" data-tip="More actions" data-act="projMenu" data-t="${t}">${I.kebab}</button></article>`).join('')}</div></section>
  <article class="ocard">${photo('606', '606', '')}<span class="status onimg">On display</span><div><h3 class="ctitle">606</h3><div class="csub">Universal shelving system · 1960</div></div></article>`;
syncTabs($('#view'));

/* ---------- the carousel ---------- */
function carStep() { const s = $('#strip'), c = s && $('.ccard', s); return c ? c.offsetWidth + 8 : 308; }
function measureCarousel() {
  const s = $('#strip'); if (!s) return;
  const max = s.scrollWidth - s.clientWidth, st = carStep();
  const count = Math.max(1, Math.round(max / st) + 1);
  let idx = Math.round(s.scrollLeft / st); if (s.scrollLeft >= max - 1) idx = count - 1;
  S.idx = idx;
  $('#cwrap').classList.toggle('fl', s.scrollLeft > 1);
  $('#cwrap').classList.toggle('fr', s.scrollLeft < max - 1);
  const prev = $('.cnav.prev'), next = $('.cnav.next'), lost = document.activeElement;
  prev.hidden = s.scrollLeft <= 1;
  next.hidden = s.scrollLeft >= max - 1;
  if ((lost === prev && prev.hidden) || (lost === next && next.hidden)) (prev.hidden ? next : prev).focus();
  const dots = $('#dots');
  if (dots.children.length !== count || !dots.children[idx] || !dots.children[idx].classList.contains('on')) {
    const hadFocus = dots.contains(document.activeElement);
    dots.innerHTML = Array.from({ length: count }, (_, i) => `<button class="cdot${i === idx ? ' on' : ''}" type="button" aria-label="Go to position ${i + 1}"${i === idx ? ' aria-current="true"' : ''} data-act="carGo" data-i="${i}"></button>`).join('');
    if (hadFocus) dots.children[idx].focus();
  }
}
function carGo(i) { const s = $('#strip'); s.scrollTo({ left: Math.min(i * carStep(), s.scrollWidth - s.clientWidth), behavior: reducedMotion() ? 'auto' : 'smooth' }); }
$('#strip').addEventListener('scroll', measureCarousel, { passive: true });
window.addEventListener('resize', measureCarousel);
window.addEventListener('load', measureCarousel);
if (document.fonts) document.fonts.ready.then(measureCarousel);
measureCarousel();

/* ---------- the T 52's upload: it runs, completes, and starts again ---------- */
function paintUpload() {
  const p = Math.round(UPLOAD.pct), files = Math.max(1, Math.round(14 * p / 100));
  const t = $('#up-text'), q = $('#up-pct'), b = $('#up-bar');
  t.textContent = p >= 100 ? 'All 14 photos uploaded' : `Uploading ${files} of 14 photos`;
  q.textContent = p + '%'; $('i', b).style.width = p + '%'; b.setAttribute('aria-valuenow', p);
}
paintUpload();
setInterval(() => { if (document.hidden) return; UPLOAD.pct = UPLOAD.pct >= 100 ? 12 : Math.min(100, UPLOAD.pct + 1 + Math.random() * 3); paintUpload(); }, 600);

/* ---------- actions ---------- */
Ready.on({
  car(el) { carGo(Math.max(0, S.idx + +el.dataset.d)); },
  carGo(el) { carGo(+el.dataset.i); },
  projMenu(el) { const t = el.dataset.t; openMenu(el, [{ label: 'Open', icon: I.openx, run: () => toast(`Opening the ${t}`) }, { label: 'Add photos', icon: I.up, run: () => toast(`Adding photos to the ${t}`) }, { label: 'Edit record…', icon: I.rename, run: () => toast(`Editing the ${t} record`) }], { align: 'right', width: 220 }); },
});
document.addEventListener('ready:tab', (e) => {
  if (e.detail.tabs !== 'Design') return;
  S.tab = e.detail.i;
  const sh = $('#fx-sheet'); sh.innerHTML = sheetHtml(FT[S.tab]); sh.setAttribute('aria-labelledby', 'design-tab-' + S.tab);
});
})();
</script>
</body>
</html>
